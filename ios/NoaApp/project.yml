name: NoaApp
options:
  bundleIdPrefix: com.noetzel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  Noa:
    path: ../Noa

targets:
  NoaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NoaApp
    dependencies:
      - package: Noa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noetzel.NoaApp
        DEVELOPMENT_TEAM: W5ZWZKWX9T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: NoaApp/Info.plist
