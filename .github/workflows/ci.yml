name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — runs flaky-test-detection job
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger (e.g. for on-demand flaky detection)

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql+asyncpg://noa:noa@localhost:5432/noa"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      NOA_ENV: "test"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,orchestrator,dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -x -q --tb=short \
            --cov=src/noa \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=70
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      NOA_ENV: "test"
      TEST_DATABASE_URL: "postgresql+asyncpg://noa:noa@localhost:5432/noa_test"
      DATABASE_URL: "postgresql+asyncpg://noa:noa@localhost:5432/noa_test"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-int-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,orchestrator,dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        continue-on-error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test -- --run
        continue-on-error: false

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-static-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-static-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,orchestrator,dev]"

      - name: Ruff lint check
        run: ruff check src/ tests/
        continue-on-error: false

      - name: Mypy type check
        run: mypy src/noa/
        continue-on-error: false

      - name: Requirements traceability check
        run: python tools/traceability.py --check --output /dev/null
        continue-on-error: true
        # Non-zero exit flags orphaned critical sections (§1–§25).
        # continue-on-error: true because Phase 2 sections (§4.2–§4.3, §7.2,
        # §10.2–§10.3, §11.4, §20.2–§20.5) are intentionally deferred.
        # Remove continue-on-error when all critical sections are covered.

  flaky-test-detection:
    name: Flaky Test Detection (Nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on schedule (nightly) or when manually triggered
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      DATABASE_URL: "postgresql+asyncpg://noa:noa@localhost:5432/noa"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      NOA_ENV: "test"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa
          POSTGRES_DB: noa
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-flaky-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,orchestrator,dev]"

      - name: Run unit tests 3x to detect flaky tests
        # pytest-repeat: any test that fails on any of the 3 runs is flagged.
        # --count=3 repeats every test 3 times in the same pytest session.
        # Use -v so flaky test names are visible in the job output.
        run: pytest tests/unit/ --count=3 -v --tb=short -q
        continue-on-error: true

      - name: Upload flaky test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-test-results
          path: .pytest_cache/
          retention-days: 7
