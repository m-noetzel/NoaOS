name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/Noa
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test
