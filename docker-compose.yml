# Noa Phase 1 — Single Machine Deployment
# SPEC.md §7.1, §20.1
#
# Networks:
#   noa-internal: Private domain (internal: true — no internet)
#   noa-external: External domain (internet access for LLM APIs)
#
# The noa-api container bridges both networks (gateway).
# Private and external workers are on separate networks with no route.

services:
  noa-api:
    build:
      context: .
      dockerfile: docker/noa-api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # LAN only, never 0.0.0.0 (§20.1)
    networks:
      - noa-internal
      - noa-external
    environment:
      - DATABASE_URL=postgresql+asyncpg://noa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/noa
      - NOA_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=INFO
      # LLM provider keys — injected from Keychain at runtime (§11.1)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      # Tool credentials
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      private-worker:
        condition: service_healthy
      external-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Container hardening (§8.1)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    networks:
      - noa-internal
    environment:
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: noa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  private-worker:
    build:
      context: .
      dockerfile: docker/private-worker/Dockerfile
    networks:
      - noa-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Container hardening (§8.1)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - private-data:/data  # Dedicated encrypted volume for private data
    tmpfs:
      - /tmp:size=256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 32G
    restart: unless-stopped

  external-worker:
    build:
      context: .
      dockerfile: docker/external-worker/Dockerfile
    networks:
      - noa-external
    labels:
      noa.egress.allowlist: "api.anthropic.com,api.openai.com,generativelanguage.googleapis.com,gmail.googleapis.com,www.googleapis.com,oauth2.googleapis.com,accounts.google.com,api.notion.com,api.tavily.com,registry.npmjs.org,pypi.org,files.pythonhosted.org"
      noa.dns.logging: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Container hardening (§8.2)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - coding-workspace:/workspace  # Only writable volume
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    networks:
      - noa-internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE must be set}
      - PGHOST=postgres
      - PGUSER=noa
      - PGDATABASE=noa
    volumes:
      - backups:/backups
      - private-data:/data:ro
    # Container hardening (§8.1, §10.5)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    restart: unless-stopped

networks:
  noa-internal:
    driver: bridge
    internal: true   # NO internet access — private domain (§20.1)
  noa-external:
    driver: bridge
    internal: false  # Internet access allowed — external domain

volumes:
  postgres-data:
  private-data:
  coding-workspace:
  backups:
