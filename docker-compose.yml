# Noa Phase 1 — Single Machine Deployment
# SPEC.md §7.1, §20.1
#
# Networks:
#   noa-internal: Private domain (internal: true — no internet)
#   noa-external: External domain (internet access for LLM APIs)
#
# The noa-api container bridges both networks (gateway).
# Private and external workers are on separate networks with no route.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - noa-internal    # Can reach noa-api on the internal network
      - noa-external    # Required so Caddy can reach ACME servers for Let's Encrypt
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - NOA_DOMAIN=${NOA_DOMAIN:-localhost}
      - NOA_ACME_EMAIL=${NOA_ACME_EMAIL:-noa@localhost}
    depends_on:
      noa-api:
        condition: service_healthy
    # Container hardening (§8.1, DE3)
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # Required: Caddy must bind ports 80 and 443
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/noa-api/Dockerfile
    command: alembic upgrade head
    networks:
      - noa-internal
    environment:
      - DATABASE_URL=postgresql+asyncpg://noa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/noa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  noa-api:
    build:
      context: .
      dockerfile: docker/noa-api/Dockerfile
    # Port 8000 is NOT exposed to the host in production.
    # All external traffic goes through Caddy (ports 80/443 above).
    # For local dev without Caddy, use docker-compose.dev.yml which overrides
    # this service to re-expose port 8000 directly.
    expose:
      - "8000"
    networks:
      - noa-internal
      - noa-external
    environment:
      - DATABASE_URL=postgresql+asyncpg://noa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/noa
      - NOA_ENV=${NOA_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=INFO
      # LLM provider keys — injected from Keychain at runtime (§11.1)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      # Tool credentials
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GOOGLE_REDIRECT_URI=http://${NOA_DOMAIN:-localhost:8000}/api/v1/auth/google/callback
      - FRONTEND_URL=${FRONTEND_URL:-}
      - TZ=${TZ:-Europe/Berlin}
      # Langfuse observability (LF1)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      private-worker:
        condition: service_healthy
      external-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./src:/app/src:ro  # Live source mount — restart picks up changes without rebuild
      - ./prompts:/app/prompts:rw  # System prompt file — editable from UI and host
      - backups:/backups:ro  # Backup verify_status.json for GET /health/backup (§10.5)
      - private-data:/data  # Memory facts persistence (BE-H6)
    # Container hardening (§8.1)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    networks:
      - noa-internal
    environment:
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: noa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  private-worker:
    build:
      context: .
      dockerfile: docker/private-worker/Dockerfile
    networks:
      - noa-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Container hardening (§8.1)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - private-data:/data  # Dedicated encrypted volume for private data
    tmpfs:
      - /tmp:size=256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 32G
    restart: unless-stopped

  external-worker:
    build:
      context: .
      dockerfile: docker/external-worker/Dockerfile
    networks:
      - noa-external
    labels:
      noa.egress.allowlist: "api.anthropic.com,api.openai.com,generativelanguage.googleapis.com,gmail.googleapis.com,www.googleapis.com,oauth2.googleapis.com,accounts.google.com,api.notion.com,api.tavily.com,registry.npmjs.org,pypi.org,files.pythonhosted.org"
      noa.dns.logging: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Container hardening (§8.2)
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - coding-workspace:/workspace  # Only writable volume
      - external-data:/data          # Persistent memory storage (W23-FIX)
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    networks:
      - noa-internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE must be set}
      - PGHOST=postgres
      - PGUSER=noa
      - PGDATABASE=noa
    volumes:
      - backups:/backups
      - private-data:/data:ro
    # Backup is internal-only (no network exposure); dcron needs SETUID/SETGID to
    # fork cron jobs, so cap_drop/read_only are not applied here (§8.1 exemption).
    # init: true prevents crond from being PID 1 (session leader), which blocks setpgid.
    init: true
    tmpfs:
      - /tmp:size=256M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - noa-external
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-nextauth-secret
      SALT: langfuse-salt
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    networks:
      - noa-external
    restart: unless-stopped

networks:
  noa-internal:
    driver: bridge
    internal: true   # NO internet access — private domain (§20.1)
  noa-external:
    driver: bridge
    internal: false  # Internet access allowed — external domain

volumes:
  postgres-data:
    name: noa-pgdata
  private-data:
    name: noa-private-data
  coding-workspace:
  backups:
  external-data:
    name: noa-external-data
  caddy-data:    # Caddy TLS certificates and ACME state
  caddy-config:  # Caddy runtime configuration cache
  langfuse-db-data:
