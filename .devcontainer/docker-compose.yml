# VS Code Dev Container — standalone compose (NOT an overlay on dev-full.yml)
#
# Docker Compose merges lists (tmpfs, cap_drop) instead of replacing them,
# so overriding dev-full.yml doesn't work. This file is self-contained.

services:

  # ── Dev container (VS Code Server + test runner + Playwright) ──────
  dev:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    container_name: noa-devcontainer
    working_dir: /workspaces/NoaOS
    # Run as root initially — VS Code switches to remoteUser (devuser) after setup
    user: root
    command: sleep infinity
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:4173:4173"
    volumes:
      - ..:/workspaces/NoaOS:cached
      - ../artifacts_out:/artifacts:rw
      - dev-npm-cache:/home/devuser/.npm
      - vscode-server-data:/home/devuser/.vscode-server
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NOA_SHELL_TIMEOUT=300
      - NOA_SHELL_MEMORY_MB=4096
      - NOA_SHELL_MAX_CONCURRENT=2
      - NOA_ENV=development
      - TEST_DATABASE_URL=postgresql+asyncpg://noa:dev-pg-password@postgres-dev:5432/noa_test
      - API_PROXY_TARGET=http://noa-api-dev:8000
    # NO read_only, NO cap_drop, NO security_opt — VS Code needs write access
    tmpfs:
      - /tmp:size=512m
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 1024
    networks:
      - noa-dev-net
      - noa-dev-internal
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
      noa-api-dev:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ── Postgres (dev-only data) ───────────────────────────────────────
  postgres-dev:
    image: postgres:16-alpine
    container_name: noa-postgres-devcontainer
    environment:
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: dev-pg-password
      POSTGRES_DB: noa_test
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    networks:
      - noa-dev-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /tmp:size=64m

  # ── Migrations (runs once, exits) ──────────────────────────────────
  migrate-dev:
    build:
      context: ..
      dockerfile: docker/noa-api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://noa:dev-pg-password@postgres-dev:5432/noa_test
    networks:
      - noa-dev-internal
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: "no"

  # ── API server (hot reload) ────────────────────────────────────────
  noa-api-dev:
    build:
      context: ..
      dockerfile: docker/noa-api/Dockerfile
    container_name: noa-api-devcontainer
    command: ["uvicorn", "noa.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://noa:dev-pg-password@postgres-dev:5432/noa_test
      - NOA_ENV=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-not-for-production}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-not-for-production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PRIVATE_WORKER_HEALTH_URL=http://private-worker-dev:8001/health
      - EXTERNAL_WORKER_HEALTH_URL=http://external-worker-dev:8002/health
      - LOG_LEVEL=DEBUG
    volumes:
      - ../src:/app/src:rw
    networks:
      - noa-dev-internal
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    tmpfs:
      - /tmp:size=256m

networks:
  noa-dev-net:
    driver: bridge
  noa-dev-internal:
    driver: bridge

volumes:
  dev-npm-cache:
  dev-postgres-data:
  vscode-server-data:
