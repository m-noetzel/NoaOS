services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: noa-dev
    working_dir: /workspace
    ports:
      - "127.0.0.1:5173:5173"   # vite dev server
      - "127.0.0.1:4173:4173"   # vite preview server
    volumes:
      - ./:/workspace:rw
      - ./artifacts_out:/artifacts:rw
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/devuser:size=256m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 1024
    networks:
      - noa-isolated
    stdin_open: true
    tty: true

networks:
  noa-isolated:
    driver: bridge
