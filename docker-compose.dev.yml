services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: noa-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace:rw
      - ./artifacts_out:/artifacts:rw
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/devuser:size=128m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
    networks:
      - noa-isolated
    stdin_open: true
    tty: true

networks:
  noa-isolated:
    driver: bridge
