# Noa Dev Container — Claude Code development environment
# Policy: docs/DEV_CONTAINER_POLICY.md
# Security: SPEC.md §2.4, §8

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: noa-dev
    working_dir: /workspace
    user: "1000:1000"
    ports:
      - "127.0.0.1:5173:5173"   # vite dev server
      - "127.0.0.1:4173:4173"   # vite preview server
    volumes:
      # Workspace only — no broad host mounts (§8.2)
      - ./:/workspace:rw
      - ./artifacts_out:/artifacts:rw
      # Named volume for caches (not host-mounted)
      - dev-npm-cache:/home/devuser/.npm
    environment:
      # Test-only API keys — injected from host env, never hardcoded
      # These are consumed by Claude Code and test runs, not production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Resource caps (§2.4) — enforced at application level
      - NOA_SHELL_TIMEOUT=300
      - NOA_SHELL_MEMORY_MB=4096
      - NOA_SHELL_MAX_CONCURRENT=2
      # Dev environment marker
      - NOA_ENV=development

    # ── Container Hardening (§8.1, §8.2) ──────────────────────────
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Default Docker seccomp profile is applied automatically (§8.1)
    tmpfs:
      - /tmp:size=512m
      - /home/devuser:size=256m,uid=1000,gid=1000

    # ── Resource Limits ───────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 1024

    # ── Network ───────────────────────────────────────────────────
    # Note: Docker does not support domain-based egress allowlists natively.
    # The policy allowlist (docs/DEV_CONTAINER_POLICY.md) documents which
    # domains are permitted. Enforcement requires a proxy or firewall rules
    # at the host level. The network is NOT internal because Claude Code
    # needs to reach api.anthropic.com for LLM calls.
    networks:
      - noa-dev-net
    dns:
      - 1.1.1.1
      - 8.8.8.8

    # ── NOT set (denied by policy) ────────────────────────────────
    # privileged: false          (default — no --privileged)
    # pid: "host"                (not set — no --pid=host)
    # network_mode: "host"       (not set — no --network=host)
    # No /var/run/docker.sock mount
    # No ~/.ssh, ~/Documents, ~/Downloads mounts

    stdin_open: true
    tty: true

networks:
  noa-dev-net:
    driver: bridge

volumes:
  dev-npm-cache:
